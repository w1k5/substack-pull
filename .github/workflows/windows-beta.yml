name: Windows beta build

on: workflow_dispatch

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install tzdata
      - run: python -m unittest discover -s tests
      - name: Build Windows beta
        shell: pwsh
        run: ./desktop/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Clearview-Windows-beta
          path: |
            desktop/windows/.build/Clearview-*-windows-x64.zip
            desktop/windows/.build/SHA256SUMS-windows.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
