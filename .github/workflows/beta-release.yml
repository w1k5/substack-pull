name: Stage Clearview beta release

on:
  workflow_run:
    workflows: [Mac beta build, Windows beta build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mac_run:
        description: Successful Mac beta run ID
        required: true
        type: string
      windows_run:
        description: Successful Windows beta run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: clearview-beta-release

jobs:
  draft:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate package runs and stage prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_RUN: ${{ inputs.mac_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            source_sha=$(jq -er .workflow_run.head_sha "$GITHUB_EVENT_PATH")
            find_run() {
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?branch=main&event=workflow_dispatch&status=success&head_sha=$source_sha" \
                --jq '.workflow_runs[0].id // empty'
            }
            MAC_RUN=$(find_run macos-beta.yml)
            WINDOWS_RUN=$(find_run windows-beta.yml)
            if [[ -z "$MAC_RUN" || -z "$WINDOWS_RUN" ]]; then
              echo 'Waiting for a successful build on the other platform.'
              exit 0
            fi
          fi
          [[ "$MAC_RUN" =~ ^[0-9]+$ && "$WINDOWS_RUN" =~ ^[0-9]+$ ]]
          verify_run() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1" | jq -er --arg workflow "$2" --arg repo "$GITHUB_REPOSITORY" '
              select(.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "main"
                     and .head_repository.full_name == $repo and .path == $workflow) | .head_sha'
          }
          mac_sha=$(verify_run "$MAC_RUN" .github/workflows/macos-beta.yml)
          windows_sha=$(verify_run "$WINDOWS_RUN" .github/workflows/windows-beta.yml)
          [[ "$mac_sha" == "$windows_sha" && "$mac_sha" =~ ^[0-9a-f]{40}$ ]]
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/desktop/release.json?ref=$mac_sha" --jq .content | base64 -d | jq -er .version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'The beta release already exists.'
            exit 0
          fi
          gh run download "$MAC_RUN" -n Clearview-macOS-beta -D assets
          gh run download "$WINDOWS_RUN" -n Clearview-Windows-beta -D assets
          cd assets
          mac="Clearview-$version-macos-arm64"
          windows="Clearview-$version-windows-x64.zip"
          sha256sum --check SHA256SUMS-macos.txt
          sha256sum --check SHA256SUMS-windows.txt
          sha256sum "$mac.zip" "$mac.dmg" "$windows" > SHA256SUMS.txt
          gh release create "v$version" "$mac.zip" "$mac.dmg" "$windows" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$mac_sha" --draft --prerelease \
            --title "Clearview $version" \
            --notes "Limited beta for Apple Silicon Macs and Windows 11 x64. The Mac build is ad hoc signed and the Windows build is unsigned. Publish after confirming first launch, Substack sign-in, and dashboard loading on both platforms."
